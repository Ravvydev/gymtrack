<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">

        <div class="forgot-box">

            <h1>Recuperar Senha</h1>
            <p>Informe o e-mail cadastrado de redefinição de senha.</p>

            <form>

                <div class="input-group">

                    <label for="email">E-mail</label>
                    
                    <input 
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>

                <button type="submit">
                    Enviar instruções
                </button>
            </form>

            <div class="back-login">
                <a href="/gymtrack/frontend/pages/login/login.html"> ← Voltar para o login</a>
            </div>
        </div>

    </div>
</body>
</html>
