spring.datasource.url=jdbc:postgresql://localhost:5432/GYMTRACK
server.port=8080
spring.datasource.username=postgres
spring.datasource.password=1213
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Cole em src/main/resources/application.properties
# NUNCA coloque o valor do segredo aqui: ele vem da variável de ambiente JWT_SECRET.
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-minutes=60

app.cors.allowed-origins=http://localhost:3000

//ADMIN
app.admin.email=${ADMIN_EMAIL:}
app.admin.senha=${ADMIN_SENHA:}