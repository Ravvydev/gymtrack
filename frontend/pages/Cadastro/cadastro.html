<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta</title>
    <link rel="stylesheet" href="style.css">
    <link href="/fontawesome-free-7.3.0-web/css/all.css" rel="stylesheet" />
</head>
<body>
      <div class="container">

        <div class="register-box">
            <h1>Criar conta</h1>
            <p>Preencha os dados abaixo para se cadastrar</p>

            <form>

                <div class="input-group">
                    <label for="nome"> <i class="fa-solid fa-user"></i> Nome completo</label>
                    
                    <input 
                        type="text"
                        id="nome"
                        placeholder="Digite seu nome"
                        required
                    >
                        
                </div>

                
                <div class="input-group">
                    <label for="email"><i class="fa-solid fa-envelope"></i> E-mail</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        required
                    
                    >
                </div>

                <div class="input-group">
                    <label for="senha"><i class="fa-solid fa-lock"></i> Senha:</label>

                    <input 
                        type="password"
                        id="senha"
                        placeholder="Crie uma senha"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="confirmarSenha"><i class="fa-solid fa-lock"></i> Confimar senha</label>

                    <input
                        type="password"
                        id="confirmarSenha"
                        placeholder="Digite novamente a senha"
                        required
                    >

                <div class="terms">
                     <label for="termos">Concordo com os termos de uso.</label>

                    <input 
                    type="checkbox"
                    id="termos"
                    required
                    >

                </div>

                
                <button type="submit">
                    Criar Conta
                </button>
            </form>

            <div class="login-link">
                Já possui uma conta? <a href="/gymtrack/frontend/pages/login/login.html">Fazer login</a>
            </div>
        </div>
    </div>
</body>
</html>
