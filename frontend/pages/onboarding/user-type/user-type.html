<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quem é Você?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="header">

                <button class="back-button">
                    ←
                </button>

                <div class="progress">

                    <div class="progress-fill"></div>

                </div>

                <span>1/6</span>

            </div>

            <div class="image">

                <img src="/gymtrack/frontend/assets/images/onboarding/img-userType.png">

            </div>

            <div class="content">

                <h1>Quem é você?</h1>

                <p>

                    Escolha como deseja utilizar
                    a plataforma.

                </p>

            </div>

            <div class="cards">

                <div class="user-card" id="student">

                    <h2>👨‍🎓</h2>

                    <h3>Aluno</h3>

                    <p> Quero acompanhar minhas avaliações e evolução física.</p>
                
                </div>


                <div class="user-card" id="teacher">

                    <h2>👨‍🏫</h2>

                    <h3>Professor</h3>

                    <p>

                        Quero cadastrar
                        alunos e realizar
                        avaliações.

                    </p>

                </div>

            </div>

            <button
                id="continue-button"
                disabled>

                Continuar

            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
